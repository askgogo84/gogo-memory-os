name: Brain follow-up acceptance - immutable PR head
on:
  pull_request:
    paths:
      - 'lib/agent/brain.ts'
      - 'scripts/verify-brain-followup-acceptance-nov6.mts'
      - '.github/workflows/brain-followup-acceptance-literal-head.yml'
permissions:
  contents: read
jobs:
  brain-followup-literal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert literal feature head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency installation
        run: npm ci
      - name: Original-function provider acceptance and unknown outcome regression
        run: npx tsx scripts/verify-brain-followup-acceptance-nov6.mts
      - name: Existing context-first brain regression
        run: npx tsx scripts/verify-brain-oct27.mts
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: TypeScript check
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
