name: SecondBrain invite acceptance durability (TEST ONLY - safety RED)
on:
  pull_request:
    paths:
      - scripts/verify-secondbrain-invite-atomicity-testonly.mjs
      - .github/workflows/secondbrain-invite-atomicity-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm literal PR head checkout
        run: |
          echo "EXPECTED_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Execute original SecondBrain source with synthetic DB
        run: node scripts/verify-secondbrain-invite-atomicity-testonly.mjs
