name: Email-attention private event retention (test-only expected RED)
on:
  pull_request:
    paths:
      - scripts/verify-email-attention-event-retention-testonly.mts
      - .github/workflows/email-attention-event-retention-testonly.yml

permissions:
  contents: read

jobs:
  synthetic-email-attention-event-retention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise shipped attention event persistence with entirely inert DB
        run: npx --yes tsx scripts/verify-email-attention-event-retention-testonly.mts
