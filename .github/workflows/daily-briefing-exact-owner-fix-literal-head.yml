name: Daily briefing owner/recipient isolation — literal PR HEAD
on:
  pull_request:
    paths:
      - 'app/api/cron/daily-briefings/route.ts'
      - 'scripts/verify-daily-briefing-exact-owner-fix.mjs'
      - '.github/workflows/daily-briefing-exact-owner-fix-literal-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-briefing-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal feature HEAD, never synthetic PR merge
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Full registered regressions on exact source HEAD
        run: npm test
      - name: Typecheck on exact source HEAD
        run: npm run typecheck
      - name: Production fixture build on exact source HEAD
        run: npm run build
      - name: Exercise unchanged source flow with 7 controls and 14 fictional privacy assertions
        run: node scripts/verify-daily-briefing-exact-owner-fix.mjs
