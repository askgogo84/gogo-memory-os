name: Shortlink Sensitive Reclassification

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/services/document-links.ts'
      - 'scripts/verify-shortlink-sensitive-reclassification.mts'
      - '.github/workflows/shortlink-sensitive-reclassification.yml'

permissions:
  contents: read

jobs:
  synthetic-sensitive-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture dependencies
        run: npm ci
      - name: Verify current-document sensitivity at bearer-link boundary
        run: npx --no-install tsx scripts/verify-shortlink-sensitive-reclassification.mts
