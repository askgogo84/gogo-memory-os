name: Watcher outbound exact owner — literal HEAD diagnostic
on:
  pull_request:
    paths:
      - 'scripts/verify-watcher-outbound-owner-precision-testonly.mjs'
      - '.github/workflows/watcher-outbound-owner-literal-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watcher-outbound-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact literal feature SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Locked inert test dependencies
        run: npm ci --ignore-scripts
      - name: Execute original source in sealed fictional VM
        run: node scripts/verify-watcher-outbound-owner-precision-testonly.mjs
