# TEST ONLY / EXPECTED RED until #1098 owner-scoped destructive time-qualifier fix.
# DO NOT MERGE OR DEPLOY. All fakes; no providers, secrets or production actions.
name: "Bulk reminder when boundary — fake-only expected RED"
on:
  pull_request:
    paths:
      - "scripts/verify-bulk-reminder-when-boundary-testonly.mts"
      - ".github/workflows/bulk-reminder-when-boundary-testonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-qualified-bulk-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual reminder-cancel implementation with fake in-memory rows
        run: npx --no-install tsx scripts/verify-bulk-reminder-when-boundary-testonly.mts
