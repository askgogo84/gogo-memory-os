name: WhatsApp inbound diagnostic privacy (TEST ONLY - safety RED)
on:
  pull_request:
    paths:
      - scripts/verify-whatsapp-inbound-log-privacy-testonly.mjs
      - .github/workflows/whatsapp-inbound-log-privacy-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-privacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm literal head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Execute unchanged signed-handler log statements over synthetic form data
        run: node scripts/verify-whatsapp-inbound-log-privacy-testonly.mjs
