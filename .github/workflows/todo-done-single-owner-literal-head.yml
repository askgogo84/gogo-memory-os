name: Todo one-task completion - literal PR head
on:
  pull_request:
    paths:
      - 'app/api/todos/route.ts'
      - 'scripts/verify-todo-done-single-owner-literal.cjs'
      - 'scripts/verify-did-it-land-oct27.mts'
      - '.github/workflows/todo-done-single-owner-literal-head.yml'
permissions:
  contents: read
jobs:
  verify-one-todo:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert literal immutable feature HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Inert original-handler one-task completion regression
        run: node scripts/verify-todo-done-single-owner-literal.cjs
      - name: Existing privileged-route authorization regression
        run: npx tsx scripts/verify-privileged-route-auth.mts
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: TypeScript checking
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
