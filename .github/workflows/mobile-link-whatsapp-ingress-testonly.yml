name: Mobile LINK WhatsApp ingress and owner binding (TEST ONLY - safety RED)
on:
  pull_request:
    paths:
      - scripts/verify-mobile-link-whatsapp-ingress-testonly.mjs
      - .github/workflows/mobile-link-whatsapp-ingress-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-mobile-link-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout literal proposed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact branch head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency install (no provider scripts)
        run: npm ci --ignore-scripts
      - name: Run unchanged owner-link parser/approval in sealed synthetic VM
        run: node scripts/verify-mobile-link-whatsapp-ingress-testonly.mjs
