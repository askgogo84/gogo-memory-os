name: Recurring snooze idempotency (TEST ONLY - durability RED)
on:
  pull_request:
    paths:
      - scripts/verify-recurring-snooze-idempotency-testonly.mjs
      - .github/workflows/recurring-snooze-idempotency-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-snooze-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify literal checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without provider scripts
        run: npm ci --ignore-scripts
      - name: Execute original snooze function against sealed synthetic reminders
        run: node scripts/verify-recurring-snooze-idempotency-testonly.mjs
