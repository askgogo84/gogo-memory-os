name: Ops Alerts billing owner-isolation RED regression - immutable PR HEAD
on:
  pull_request:
    paths:
      - 'lib/ops/run.ts'
      - 'scripts/verify-ops-billing-owner-isolation-red.mjs'
      - '.github/workflows/ops-billing-owner-isolation-red.yml'
permissions:
  contents: read
jobs:
  verify-ops-billing-owner:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert literal PR HEAD SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Full registered regressions
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
      - name: Original-function billing owner-isolation regression (expected RED until source fix)
        run: node scripts/verify-ops-billing-owner-isolation-red.mjs
