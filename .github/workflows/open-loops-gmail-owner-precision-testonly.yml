name: Open-loop Gmail OAuth and consent exact owner (TEST ONLY - safety RED)
on:
  pull_request:
    paths:
      - scripts/verify-open-loops-gmail-owner-precision-testonly.mjs
      - .github/workflows/open-loops-gmail-owner-precision-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-gmail-consent-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without external provider scripts
        run: npm ci --ignore-scripts
      - name: Exercise unchanged Gmail attention reader with sealed fictional accounts
        run: node scripts/verify-open-loops-gmail-owner-precision-testonly.mjs
