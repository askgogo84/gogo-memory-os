name: Inbound forwarded email outcome correction — literal PR HEAD
on:
  pull_request:
    paths:
      - 'scripts/verify-inbound-notify-outcome-fix.mjs'
      - '.github/workflows/inbound-notify-outcome-fix-literal-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inbound-notify-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact feature head, never synthetic PR merge
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Full registered regressions at literal PR head
        run: npm test
      - name: Typecheck at literal PR head
        run: npm run typecheck
      - name: Production fixture build at literal PR head
        run: npm run build
      - name: Verify corrected inbound notify with sealed fictional data and zero network
        run: node scripts/verify-inbound-notify-outcome-fix.mjs
