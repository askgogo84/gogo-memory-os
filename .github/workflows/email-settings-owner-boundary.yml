name: Email Settings Owner Boundary (synthetic)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/dashboard/(app)/settings/email/page.tsx'
      - 'scripts/verify-email-settings-owner-boundary.mts'
      - '.github/workflows/email-settings-owner-boundary.yml'
permissions:
  contents: read
jobs:
  synthetic-email-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture dependencies
        run: npm ci
      - name: Verify real EmailSettingsPage with inert private services
        run: npx --no-install tsx scripts/verify-email-settings-owner-boundary.mts
