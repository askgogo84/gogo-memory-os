name: Dashboard Day Owner Boundary (synthetic)
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/dashboard/day-chat.ts'
      - 'scripts/verify-dashboard-day-owner-boundary.mts'
      - '.github/workflows/dashboard-day-owner-boundary.yml'
permissions:
  contents: read
jobs:
  synthetic-day-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture dependencies
        run: npm ci
      - name: Verify real Dashboard day-read owner boundary using inert services
        run: npx --no-install tsx scripts/verify-dashboard-day-owner-boundary.mts
