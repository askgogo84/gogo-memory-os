name: Browser sandbox exact owner (TEST ONLY - safety RED)
on:
  pull_request:
    paths:
      - scripts/verify-browser-sandbox-owner-precision-testonly.mjs
      - .github/workflows/browser-sandbox-owner-precision-testonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without provider scripts
        run: npm ci --ignore-scripts
      - name: Execute original owner resolver with synthetic account IDs
        run: node scripts/verify-browser-sandbox-owner-precision-testonly.mjs
