name: SecondBrain share audit atomicity (test-only expected RED)

on:
  pull_request:
    paths:
      - scripts/verify-secondbrain-share-audit-atomicity-testonly.mts
      - .github/workflows/secondbrain-share-audit-atomicity-testonly.yml

permissions:
  contents: read

jobs:
  synthetic-secondbrain-share-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute shipped SecondBrain access against synthetic owner and audit database
        run: npx --yes tsx scripts/verify-secondbrain-share-audit-atomicity-testonly.mts
