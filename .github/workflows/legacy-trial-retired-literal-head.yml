name: Legacy trial entitlement retirement - immutable PR head
on:
  pull_request:
    paths:
      - 'app/api/payment/trial/route.ts'
      - 'scripts/verify-product-readiness.mjs'
      - 'scripts/verify-legacy-trial-retired-nov7.mts'
      - '.github/workflows/legacy-trial-retired-literal-head.yml'
permissions:
  contents: read
jobs:
  legacy-trial-literal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact literal feature head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency installation
        run: npm ci
      - name: Inert original-route legacy trial regression
        run: npx tsx scripts/verify-legacy-trial-retired-nov7.mts
      - name: Product readiness security gates
        run: node scripts/verify-product-readiness.mjs
      - name: Full registered regressions
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: TypeScript check
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
