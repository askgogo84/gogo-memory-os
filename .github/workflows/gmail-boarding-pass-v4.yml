name: Gmail Boarding Pass Lifecycle

on:
  push:
    branches: ["feat/gmail-boarding-pass-lifecycle-v5-20260913"]
  pull_request:
    branches: ["main"]
    paths:
      - "lib/agent/life-event-email-worker.ts"
      - "lib/agent/life-event-worker.ts"
      - "app/api/cron/life-events/route.ts"
      - "scripts/verify-life-event-email-worker.mts"
      - ".github/workflows/gmail-boarding-pass-v4.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-inert-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Boarding-pass lifecycle regression
        run: npx tsx scripts/verify-life-event-email-worker.mts
