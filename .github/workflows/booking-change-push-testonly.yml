name: Booking change push receipt (test-only expected safety RED)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/verify-booking-change-push-testonly.mjs'
      - '.github/workflows/booking-change-push-testonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout is exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing lockfile dependencies
        run: npm ci
      - name: Execute original source against inert booking and push fixtures
        run: node scripts/verify-booking-change-push-testonly.mjs
