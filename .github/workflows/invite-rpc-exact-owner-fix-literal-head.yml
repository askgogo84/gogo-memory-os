name: Invite RPC exact owner — literal PR HEAD
on:
  pull_request:
    paths:
      - 'lib/invites/store.ts'
      - 'scripts/verify-invite-rpc-exact-owner-fix.mjs'
      - '.github/workflows/invite-rpc-exact-owner-fix-literal-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invite-rpc-exact-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal source commit, not synthetic PR merge
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Production fixture build
        run: npm run build
      - name: Original-source synthetic invite RPC owner tests
        run: node scripts/verify-invite-rpc-exact-owner-fix.mjs
