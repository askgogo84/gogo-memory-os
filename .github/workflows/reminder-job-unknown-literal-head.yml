name: Reminder answer unknown-outcome no-duplicate - immutable PR HEAD
on:
  pull_request:
    paths:
      - 'app/api/cron/reminders/route.ts'
      - 'scripts/verify-reminder-job-unknown-fallback-fix.mts'
      - '.github/workflows/reminder-job-unknown-literal-head.yml'
permissions:
  contents: read
jobs:
  reminder-job-unknown:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert immutable PR HEAD SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Full registered regressions
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
      - name: Inert original-source provider unknown-outcome safety
        run: npx --yes tsx scripts/verify-reminder-job-unknown-fallback-fix.mts
