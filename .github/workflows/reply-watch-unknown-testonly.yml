# TEST ONLY — EXPECTED RED until Gmail reply-watch absence/unknown is corrected.
# No provider, DB, credential, actual cron, send, reminder, or production invocation.
name: "Gmail reply-watch evidence boundary — fake-only expected RED"
on:
  pull_request:
    paths:
      - "scripts/verify-reply-watch-unknown-testonly.mts"
      - ".github/workflows/reply-watch-unknown-testonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-reply-watch-incomplete-view:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run actual reply-watch read implementation with synthetic owner and mailbox
        run: npx --no-install tsx scripts/verify-reply-watch-unknown-testonly.mts
