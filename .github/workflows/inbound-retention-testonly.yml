name: Forwarded-email 30-day retention (test-only expected RED)

on:
  pull_request:
    paths:
      - 'scripts/verify-inbound-retention-testonly.mjs'
      - '.github/workflows/inbound-retention-testonly.yml'

permissions:
  contents: read

jobs:
  forwarded-email-retention-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify literal PR head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exercise unchanged inbound handler in sealed synthetic VM
        run: node scripts/verify-inbound-retention-testonly.mjs
