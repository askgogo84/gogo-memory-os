name: Reel metadata private-host and redirect boundary (test-only expected RED)

on:
  pull_request:
    paths:
      - 'scripts/verify-reel-metadata-egress-testonly.mts'
      - '.github/workflows/reel-metadata-egress-testonly.yml'

permissions:
  contents: read

jobs:
  negative-reel-metadata-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify literal PR head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute unmodified reel-saver module with inert synthetic egress
        run: npx --yes tsx scripts/verify-reel-metadata-egress-testonly.mts
