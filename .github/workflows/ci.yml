name: AskGogo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same commands as `npm test` (every scripts/tests.d list), several at a time. 15 Nov audit: this one job replaced
      # 90 single-purpose workflows that each ran only when a few named files changed; their checks are all in the
      # lists now and run on every PR.
      - name: Full regression suite
        run: node scripts/run-tests-parallel.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build with fixture credentials
        run: npm run build
