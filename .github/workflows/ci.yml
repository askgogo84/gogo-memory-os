name: AskGogo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full regression suite
        run: npm test

      - name: Typecheck (advisory baseline)
        continue-on-error: true
        run: npm run typecheck


  architecture_contract:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'architecture/brain-vault-v1-20260921' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Brain + Vault architecture contract
        run: npm run architecture:verify

  claude_architecture_review:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'architecture/brain-vault-v1-20260921' && secrets.ANTHROPIC_API_KEY != '' }}
    needs: architecture_contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ARCHITECTURE_REVIEW_MODEL: claude-sonnet-4-5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Claude adversarial architecture review
        run: npm run architecture:review
      - name: Upload Claude review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-brain-vault-architecture-review
          path: docs/architecture/CLAUDE_REVIEW_V1.md
          if-no-files-found: error
