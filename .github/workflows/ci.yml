name: AskGogo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same commands as `npm test` (package.json chain + scripts/tests.d), several at a time: the sequential chain
      # took ~18.5 of the 20 minutes and runs were cut off at the typecheck (13 Nov, owner: parallelize the runner).
      - name: Full regression suite
        run: node scripts/run-tests-parallel.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build with fixture credentials
        run: npm run build
