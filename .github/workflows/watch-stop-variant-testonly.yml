name: Watch-stop product variant isolation regression (test-only expected RED)
on:
  pull_request:
    paths:
      - scripts/verify-watch-stop-variant-testonly.mts
      - .github/workflows/watch-stop-variant-testonly.yml

permissions:
  contents: read

jobs:
  synthetic-watch-stop-variant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual watch-command stop with fake owner-bound DB only
        run: npx --yes tsx scripts/verify-watch-stop-variant-testonly.mts
