name: WhatsApp checkout owner isolation - immutable PR head
on:
  pull_request:
    paths:
      - 'lib/bot/handlers/plan-checkout.ts'
      - 'scripts/verify-checkout-owner-identity-nov7.mts'
      - '.github/workflows/checkout-owner-literal-head.yml'
permissions:
  contents: read
jobs:
  checkout-owner-literal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact literal feature head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency installation
        run: npm ci
      - name: Inert original checkout owner regression
        run: npx tsx scripts/verify-checkout-owner-identity-nov7.mts
      - name: Existing billing owner and policy safety tests
        run: |
          npx tsx scripts/verify-owner-confirmation.mts
          npx tsx scripts/verify-approval-policy.mts
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: TypeScript check
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
