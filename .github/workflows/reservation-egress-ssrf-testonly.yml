name: Reservation egress SSRF containment (TEST ONLY - safety RED)

on:
  pull_request:
    paths:
      - scripts/verify-reservation-egress-ssrf-testonly.mts
      - .github/workflows/reservation-egress-ssrf-testonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable checkout provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute unchanged ReserveGo and booking-engine functions with synthetic injected fetch
        run: npx --no-install tsx scripts/verify-reservation-egress-ssrf-testonly.mts
