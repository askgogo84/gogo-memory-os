name: Briefing cron owner identity — literal feature HEAD privacy diagnostic
on:
  pull_request:
    paths:
      - 'scripts/verify-briefing-cron-owner-testonly.mjs'
      - '.github/workflows/briefing-cron-owner-literal-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  briefing-cron-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm checked-out literal feature HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked, inert test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise unchanged briefing cron with fictional owner rows and intercepted sends
        run: node scripts/verify-briefing-cron-owner-testonly.mjs
