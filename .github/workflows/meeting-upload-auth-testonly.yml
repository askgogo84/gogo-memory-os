name: Meeting upload owner authentication (test-only expected RED)

on:
  pull_request:
    paths:
      - 'scripts/verify-meeting-upload-auth-testonly.mts'
      - '.github/workflows/meeting-upload-auth-testonly.yml'

permissions:
  contents: read

jobs:
  synthetic-meeting-upload-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm literal head SHA
        run: |
          HEAD="$(git rev-parse HEAD)"
          echo "Checked-out head: $HEAD"
          test "$HEAD" = "${{ github.event.pull_request.head.sha }}"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute shipped route against inert anonymous uploader fixtures
        run: npx --yes tsx scripts/verify-meeting-upload-auth-testonly.mts
