# TEST ONLY / EXPECTED RED — SecondBrain offboarding share consistency.
# No real DB/credentials/customer operations. Do not merge or deploy.
name: "SecondBrain contributor revocation — synthetic expected RED"
on:
  pull_request:
    paths:
      - "scripts/verify-secondbrain-revocation-atomicity-testonly.mts"
      - ".github/workflows/secondbrain-revocation-atomicity-testonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual SecondBrain revocation functions against synthetic database
        run: npx --no-install tsx scripts/verify-secondbrain-revocation-atomicity-testonly.mts
