name: Document Storage Patch Acknowledgement

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/services/document-store.ts'
      - 'scripts/verify-document-storage-patch-ack.mts'
      - '.github/workflows/document-storage-patch-ack.yml'

permissions:
  contents: read

jobs:
  synthetic-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture dependencies
        run: npm ci
      - name: Verify owner-bound storage patch ack (fake transport only)
        run: npx --no-install tsx scripts/verify-document-storage-patch-ack.mts
