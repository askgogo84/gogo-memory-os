name: Temporary bridge fail-closed port
on: [push]
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-bridge-fail-closed-current-20260920
      - name: Apply narrow fail-closed fix and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/feature-intents.ts')
          s=p.read_text()
          pattern=r"(  \} catch \(err: any\) \{\n    console\.error\('WHATSAPP_AGENT_BRIDGE_FAILED:', err\?\.message \|\| err\)\n)    return null"
          replacement=r"\1    // Infrastructure/execution failure is not a routing non-match. Fail closed\n    // instead of falling through to processIncomingMessage/plain LLM.\n    return 'I hit a problem while running that AskGogo action, so I stopped instead of guessing or falling back to an unverified answer. Please try again shortly.'"
          s,n=re.subn(pattern,replacement,s,count=1)
          assert n==1, 'feature-intents catch block changed; refusing blind patch'
          p.write_text(s)
          t=Path('scripts/verify-agent-whatsapp-bridge.mts')
          q=t.read_text()
          anchor="assert.match(router,/read-only Gmail, Contacts and Drive/)\n"
          addition="\n// Infrastructure/execution exceptions are not clean routing non-matches.\nconst bridgeFailureCatch=router.indexOf(\"console.error('WHATSAPP_AGENT_BRIDGE_FAILED:'\")\nassert.ok(bridgeFailureCatch>=0,'bridge failure catch must exist')\nconst bridgeFailureTail=router.slice(bridgeFailureCatch,bridgeFailureCatch+900)\nassert.ok(!/return\\s+null/.test(bridgeFailureTail),'bridge exceptions must never fall through as routing non-matches')\nassert.match(bridgeFailureTail,/stopped instead of guessing/)\n"
          assert anchor in q, 'WhatsApp bridge regression anchor changed; refusing blind patch'
          if 'bridgeFailureCatch' not in q:
            q=q.replace(anchor,anchor+addition,1)
          t.write_text(q)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/tmp-port-agent-bridge-fail-closed.yml
          git config user.name "AskGogo Night Build"
          git config user.email "actions@users.noreply.github.com"
          git add lib/feature-intents.ts scripts/verify-agent-whatsapp-bridge.mts
          git commit -m "fix(agent): fail closed when WhatsApp bridge throws"
          git push origin HEAD:fix/agent-bridge-fail-closed-current-20260920
