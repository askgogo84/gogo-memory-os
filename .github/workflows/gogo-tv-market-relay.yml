name: Gogo TV Market Relay Security

on:
  push:
    branches: [feature/gogo-tv-private-market-relay-20261111]
    paths:
      - 'app/api/gogo-tv/markets/**'
      - 'scripts/verify-gogo-tv-market-relay.mts'
      - '.github/workflows/gogo-tv-market-relay.yml'
  pull_request:
    paths:
      - 'app/api/gogo-tv/markets/**'
      - 'scripts/verify-gogo-tv-market-relay.mts'
      - '.github/workflows/gogo-tv-market-relay.yml'

permissions:
  contents: read

jobs:
  auth-and-quote-validations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify API security and quote validation
        run: npx --yes tsx scripts/verify-gogo-tv-market-relay.mts
