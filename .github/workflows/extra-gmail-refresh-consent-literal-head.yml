name: Secondary Gmail refresh consent race - immutable PR head
on:
  pull_request:
    paths:
      - 'lib/agent/gmail-accounts.ts'
      - 'lib/agent/google-workspace-read.ts'
      - 'scripts/verify-extra-gmail-refresh-consent-nov6.mts'
      - '.github/workflows/extra-gmail-refresh-consent-literal-head.yml'
permissions:
  contents: read
jobs:
  gmail-refresh-consent-literal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert literal feature head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency installation
        run: npm ci
      - name: Original-module revocation race regression (inert mocks)
        run: npx tsx scripts/verify-extra-gmail-refresh-consent-nov6.mts
      - name: Existing secondary Gmail regression
        run: npx tsx scripts/verify-second-gmail-account.mts
      - name: Existing Workspace Gmail regression
        run: npx tsx scripts/verify-google-workspace-read.mts
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: TypeScript check
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
