name: Commerce Purchase Handoff Exact Head

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/commerce/purchase-*.ts'
      - 'lib/commerce/creditiq-rewards.ts'
      - 'lib/commerce/creditiq-commerce-adapter.ts'
      - 'lib/commerce/enterprise-spending-policy.ts'
      - 'lib/commerce/enterprise-purchase-approval*.ts'
      - 'lib/commerce/purchase-outcome*.ts'
      - 'lib/commerce/native-payment*.ts'
      - 'supabase/migrations/20261116080000_commerce_native_payment_readbacks.sql'
      - 'scripts/verify-commerce-native-payment-status.mts'
      - 'scripts/verify-commerce-native-confirmation.mts'
      - 'scripts/verify-commerce-provider-fixture.mts'
      - 'supabase/migrations/20261116103000_commerce_native_confirmation_once.sql'
      - 'lib/commerce/native-order-confirmation.ts'
      - 'lib/commerce/native-checkout*.ts'
      - 'lib/commerce/native-order-reconciliation*.ts'
      - 'lib/commerce/mcp.ts'
      - 'app/api/commerce/purchases/**'
      - 'app/dashboard/(app)/commerce/**'
      - 'scripts/verify-commerce-purchase-handoff.mts'
      - 'scripts/verify-commerce-purchase-store.cjs'
      - 'scripts/verify-commerce-advisory.mts'
      - 'scripts/verify-commerce-creditiq-bridge.mts'
      - 'scripts/verify-commerce-enterprise-approval.mts'
      - 'supabase/migrations/20261115150000_commerce_enterprise_spend_approvals.sql'
      - 'scripts/verify-commerce-outcome.mts'
      - 'scripts/verify-commerce-native-payment-options.mts'
      - 'scripts/verify-commerce-native-checkout.mts'
      - 'scripts/verify-commerce-native-orders.mts'
      - 'supabase/migrations/20261115180000_commerce_native_checkout_one_attempt.sql'
      - 'supabase/migrations/20261115120000_commerce_outcome_readbacks.sql'
      - 'supabase/migrations/20261115090000_commerce_purchase_intents.sql'
      - '.github/workflows/commerce-purchase-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert head SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Node 24 with locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Purchase boundary regression
        run: npx --no-install tsx scripts/verify-commerce-purchase-handoff.mts
      - name: Purchase ledger and approval regression
        run: node scripts/verify-commerce-purchase-store.cjs
      - name: Merchant order/payment outcome verification regressions
        run: npx --no-install tsx scripts/verify-commerce-outcome.mts
      - name: Native Swiggy payment options (read only)
        run: npx --no-install tsx scripts/verify-commerce-native-payment-options.mts
      - name: CreditIQ and enterprise advisory regressions
        run: npx --no-install tsx scripts/verify-commerce-advisory.mts
      - name: Tenant-scoped enterprise approval and audit regression
        run: npx --no-install tsx scripts/verify-commerce-enterprise-approval.mts
      - name: CreditIQ signed issuer-offer advisory bridge
        run: npx --no-install tsx scripts/verify-commerce-creditiq-bridge.mts
      - name: Native checkout single-use financial mutation contract
        run: npx --no-install tsx scripts/verify-commerce-native-checkout.mts
      - name: Authenticated merchant order history reconciliation
        run: npx --no-install tsx scripts/verify-commerce-native-orders.mts
      - name: Native merchant UPI payment status evidence checks
        run: npx --no-install tsx scripts/verify-commerce-native-payment-status.mts
      - name: Native one-shot confirmed payment finalization guard
        run: npx --no-install tsx scripts/verify-commerce-native-confirmation.mts
      - name: Provider fixture exact-args and no-retry regression
        run: npx --no-install tsx scripts/verify-commerce-provider-fixture.mts
      - name: Next typecheck
        run: npm run typecheck
      - name: Fixture production build
        run: npm run build
