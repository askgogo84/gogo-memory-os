name: Gogo TV Windows companion
on:
  pull_request:
    paths:
      - 'experimental/gogo-tvos-v215/**'
      - '.github/workflows/gogo-tv-windows-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOGO_TV_ORIGIN: https://tv-preview.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK tools
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem $env:ANDROID_HOME -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (!$sdkmanager) { throw "Android SDK manager unavailable" }
          & $sdkmanager.FullName "platforms;android-34" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }
      - name: Build and verify Windows APK
        shell: pwsh
        run: |
          python experimental/gogo-tvos-v215/verify_companion.py
          if ($LASTEXITCODE -ne 0) { throw "Companion safety checks failed" }
          & ./experimental/gogo-tvos-v215/Build-GogoTVCompanion-Windows.ps1 -OutputDir "$env:RUNNER_TEMP/GogoTV"
          $apk = Join-Path $env:RUNNER_TEMP 'GogoTV/gogo-tv-companion-test.apk'
          if ((Get-Item -LiteralPath $apk).Length -lt 40000000) { throw 'Offline model is missing from the APK.' }
