name: Friend reminder disabled delivery truth (TEST ONLY - safety RED)

on:
  pull_request:
    paths:
      - scripts/verify-friend-reminder-disabled-truth-testonly.mjs
      - .github/workflows/friend-reminder-disabled-truth-testonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-source-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact literal PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute unchanged friend reminder writer against sealed synthetic store
        run: node scripts/verify-friend-reminder-disabled-truth-testonly.mjs
