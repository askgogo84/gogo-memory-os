name: AskGogo Mobile APK Preview

on:
  push:
    branches: ["mobile/native-app-v2-reconciled-20260913"]
    paths:
      - "mobile/askgogo-native/**"
      - ".github/workflows/mobile-apk-preview.yml"
  workflow_dispatch:

concurrency:
  group: askgogo-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    defaults:
      run:
        working-directory: mobile/askgogo-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --include=dev

      - name: Align Expo SDK packages
        run: npx expo install --fix

      - name: Expo dependency check
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AskGogo-Android-Release-Candidate
          path: mobile/askgogo-native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2

  runtime-smoke:
    needs: validate-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM access for current runner
        run: |
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: AskGogo-Android-Release-Candidate
          path: mobile/askgogo-native/android/app/build/outputs/apk/release

      - name: Android release launch and render smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r mobile/askgogo-native/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n in.askgogo.app/.MainActivity >/tmp/askgogo-start.txt 2>&1
            sleep 8
            test -n "$(adb shell pidof in.askgogo.app | tr -d '\r')" || (echo "AskGogo process exited after launch"; cat /tmp/askgogo-start.txt || true; adb logcat -d -v threadtime | grep -E "in\.askgogo\.app|FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Expo|SoLoader|UnsatisfiedLinkError|Fatal signal|Exception|Error" | tail -n 450; exit 1)
            adb shell uiautomator dump /sdcard/askgogo-window.xml >/dev/null
            adb pull /sdcard/askgogo-window.xml /tmp/askgogo-window.xml >/dev/null
            grep -Eq "AskGogo|Connect the app" /tmp/askgogo-window.xml || (echo "AskGogo boot route did not render"; cat /tmp/askgogo-window.xml || true; adb logcat -d -v threadtime | grep -E "in\.askgogo\.app|FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Expo|SoLoader|UnsatisfiedLinkError|Fatal signal|Exception|Error" | tail -n 450; exit 1)

            adb shell am start -W -a android.intent.action.VIEW -d "askgogo://agent-safe" in.askgogo.app >/tmp/gogo-home-start.txt 2>&1 || true
            sleep 5
            test -n "$(adb shell pidof in.askgogo.app | tr -d '\r')" || (echo "AskGogo process exited while opening consumer Gogo Home"; cat /tmp/gogo-home-start.txt || true; adb logcat -d -v threadtime | grep -E "in\.askgogo\.app|FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Expo|SoLoader|UnsatisfiedLinkError|Fatal signal|Exception|Error" | tail -n 450; exit 1)
            adb shell uiautomator dump /sdcard/askgogo-home.xml >/dev/null
            adb pull /sdcard/askgogo-home.xml /tmp/askgogo-home.xml >/dev/null
            grep -Eq "What can Gogo take off your plate|Gogo is on it|Same brain · WhatsApp \+ app|Activity|Today" /tmp/askgogo-home.xml || (echo "Consumer Gogo Home did not render"; cat /tmp/askgogo-home.xml || true; adb logcat -d -v threadtime | grep -E "in\.askgogo\.app|FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Expo|SoLoader|UnsatisfiedLinkError|Fatal signal|Exception|Error" | tail -n 450; exit 1)
            echo "AskGogo release APK launched and consumer Gogo Home rendered successfully"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AskGogo-Android-Verified
          path: mobile/askgogo-native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
