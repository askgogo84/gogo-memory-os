name: AskGogo Mobile APK Preview

on:
  push:
    branches: ["mobile/native-app-v1"]
    paths:
      - "mobile/askgogo-native/**"
      - ".github/workflows/mobile-apk-preview.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    defaults:
      run:
        working-directory: mobile/askgogo-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK packages
        run: npx expo install --fix

      - name: Expo dependency check
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AskGogo-Android-Preview
          path: mobile/askgogo-native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
