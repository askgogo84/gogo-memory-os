name: AskGogo Mobile APK Preview

on:
  push:
    branches: ["mobile/native-app-v1"]
    paths:
      - "mobile/askgogo-native/**"
      - ".github/workflows/mobile-apk-preview.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    defaults:
      run:
        working-directory: mobile/askgogo-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK packages
        run: npx expo install --fix

      - name: Expo dependency check
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean

      # Release embeds the JS bundle so this artifact can run without Metro.
      - name: Build standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # Runtime gate: build success is not enough. Install the exact release APK,
      # launch it on a clean Android emulator, and verify the crash-safe boot
      # screen actually rendered. If the process dies or UI text is missing,
      # capture logcat and fail before uploading an artifact to the user.
      - name: Install Android emulator image
        run: |
          sdkmanager "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | avdmanager create avd -n askgogo-ci -k "system-images;android-35;google_apis;x86_64" --force

      - name: Boot Android emulator
        run: |
          nohup emulator -avd askgogo-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/askgogo-emulator.log 2>&1 &
          adb wait-for-device
          BOOT=""
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$BOOT" != "1" ]; then
            cat /tmp/askgogo-emulator.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true

      - name: Smoke test standalone APK launch
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell monkey -p in.askgogo.app -c android.intent.category.LAUNCHER 1
          sleep 8
          PID=$(adb shell pidof in.askgogo.app | tr -d '\r')
          if [ -z "$PID" ]; then
            echo "AskGogo process exited after launch"
            adb logcat -d | tail -n 500
            exit 1
          fi
          adb shell uiautomator dump /sdcard/askgogo-window.xml >/dev/null
          adb pull /sdcard/askgogo-window.xml /tmp/askgogo-window.xml >/dev/null
          if ! grep -q "AskGogo started successfully" /tmp/askgogo-window.xml; then
            echo "AskGogo process is alive but boot screen did not render"
            cat /tmp/askgogo-window.xml || true
            adb logcat -d | tail -n 500
            exit 1
          fi
          echo "AskGogo standalone APK launched and rendered successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AskGogo-Android-Standalone
          path: mobile/askgogo-native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
