name: Telegram webhook origin authentication — literal PR HEAD
on:
  pull_request:
    paths:
      - 'app/api/webhooks/telegram/route.ts'
      - 'scripts/verify-telegram-webhook-origin-auth-fix.mjs'
      - '.github/workflows/telegram-webhook-origin-auth-fix-literal-head.yml'
permissions:
  contents: read
jobs:
  telegram-webhook-auth:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require literal immutable pull request feature SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependency installation
        run: npm ci
      - name: Full registered regression suite
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Production fixture build
        run: npm run build
      - name: Sealed actual-source Telegram origin-authentication safety assertions
        run: node scripts/verify-telegram-webhook-origin-auth-fix.mjs
