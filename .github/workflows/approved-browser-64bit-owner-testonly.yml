name: Approved browser 64-bit owner binding (test-only expected RED)

on:
  pull_request:
    paths:
      - 'scripts/verify-approved-browser-64bit-owner-testonly.mts'
      - '.github/workflows/approved-browser-64bit-owner-testonly.yml'

permissions:
  contents: read

jobs:
  negative-approved-browser-owner-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert checkout is the literal PR head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA ACTUAL_SHA=$ACTUAL_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute shipped approved-browser worker using synthetic owner and approval records
        run: npx --yes tsx scripts/verify-approved-browser-64bit-owner-testonly.mts
