name: G0DM0D3 isolated evaluation lab checks

on:
  pull_request:
    paths:
      - 'scripts/g0dm0d3-lab/**'
      - 'docs/evaluations/g0dm0d3-isolated-lab.md'
      - '.github/workflows/g0dm0d3-lab-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts without credentials or network calls
        run: |
          bash -n scripts/g0dm0d3-lab/install.sh
          node --check scripts/g0dm0d3-lab/smoke.mjs
          grep -Fq 'f6301765fb90eb7b336bdf365319cd2fe44b1187' scripts/g0dm0d3-lab/install.sh
          grep -Fq 'contribute_to_dataset: false' scripts/g0dm0d3-lab/smoke.mjs
          grep -Fq 'godmode: false' scripts/g0dm0d3-lab/smoke.mjs
          grep -Fq 'parseltongue: false' scripts/g0dm0d3-lab/smoke.mjs
          grep -Fq '127.0.0.1:' scripts/g0dm0d3-lab/install.sh

  local-runtime-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned lab API in temporary local Docker
        shell: bash
        run: |
          set -euo pipefail
          export GODMODE_API_KEY="$(openssl rand -hex 32)"
          bash scripts/g0dm0d3-lab/install.sh start
          ready=0
          for _ in $(seq 1 25); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:7860/v1/health >/dev/null; then
              ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ciq-g0dm0d3-lab)" != "true" ]; then
              echo "Lab container stopped before health became ready"
              docker logs --tail 120 ciq-g0dm0d3-lab || true
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Lab health timed out"
            docker logs --tail 120 ciq-g0dm0d3-lab || true
            exit 1
          fi
          node scripts/g0dm0d3-lab/smoke.mjs askgogo
          node scripts/g0dm0d3-lab/smoke.mjs creditiq
          node scripts/g0dm0d3-lab/smoke.mjs folioiq
          node scripts/g0dm0d3-lab/smoke.mjs signudoc
          node scripts/g0dm0d3-lab/smoke.mjs tipplr
      - name: Show local container logs on failure
        if: failure()
        run: docker logs --tail 120 ciq-g0dm0d3-lab || true
      - name: Clean up temporary lab
        if: always()
        run: bash scripts/g0dm0d3-lab/install.sh stop
