name: Privileged query-secret containment (test-only expected RED)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-privileged-query-secret-testonly.mts'
      - '.github/workflows/privileged-query-secret-testonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-query-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-no-real-credential
    steps:
      - name: Check out literal pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head for pull-request events
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_SHA=%s\nACTUAL_SHA=%s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synthetic privileged query-secret regression (expected RED until corrected)
        run: node --import tsx scripts/verify-privileged-query-secret-testonly.mts
