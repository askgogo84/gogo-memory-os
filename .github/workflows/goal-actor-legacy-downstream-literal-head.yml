name: Goal actor downstream exact legacy owner — literal head (TEST ONLY)
on:
  pull_request:
    paths:
      - 'scripts/verify-goal-actor-legacy-downstream-testonly.mjs'
      - '.github/workflows/goal-actor-legacy-downstream-literal-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-head-downstream-owner:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out literal PR HEAD, never synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Independently assert literal feature commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without postinstall scripts
        run: npm ci --ignore-scripts
      - name: Run sealed real-goal-actor downstream owner safety assertions
        run: node scripts/verify-goal-actor-legacy-downstream-testonly.mjs
