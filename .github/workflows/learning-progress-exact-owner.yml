name: Learning Progress Exact Owner (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/dashboard/learning-progress/route.ts'
      - 'scripts/verify-learning-progress-exact-owner.mts'
      - '.github/workflows/learning-progress-exact-owner.yml'

permissions:
  contents: read

jobs:
  synthetic-learning-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture dependencies
        run: npm ci
      - name: Verify exact owner at real route read/write boundary with fakes only
        run: npx --no-install tsx scripts/verify-learning-progress-exact-owner.mts