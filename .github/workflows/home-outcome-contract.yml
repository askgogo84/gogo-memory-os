name: Home Unknown-Outcome Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/dashboard/home-sections.ts'
      - 'scripts/verify-home-unknown.mts'
      - '.github/workflows/home-outcome-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Home unknown-outcome regression (inert)
        run: npx --no-install tsx scripts/verify-home-unknown.mts
