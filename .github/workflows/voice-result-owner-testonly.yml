name: Voice-result exact-owner notification (TEST ONLY, expected safety RED)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-voice-result-owner-testonly.mjs'
      - '.github/workflows/voice-result-owner-testonly.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert checkout equals literal PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute original result worker with synthetic users and fake sends (EXPECTED RED)
        run: node scripts/verify-voice-result-owner-testonly.mjs
