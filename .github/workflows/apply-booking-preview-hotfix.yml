name: Apply booking preview hotfix

on:
  push:
    branches:
      - fix/whatsapp-booking-preview-routing-20260912
    paths:
      - .github/workflows/apply-booking-preview-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-booking-preview-routing-20260912
          fetch-depth: 0
      - name: Patch WhatsApp webhook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/webhooks/whatsapp/route.ts')
          s=p.read_text()
          import_line="import { handleNutritionPhoto, isNutritionPhotoCaption, handleNutritionGoalSelection } from '@/lib/bot/handlers/nutrition'\n"
          new_import=import_line+"import { shouldTreatMediaAsLinkPreview } from '@/lib/services/whatsapp-preview-routing'\n"
          if "shouldTreatMediaAsLinkPreview" not in s:
              if import_line not in s: raise SystemExit('import anchor missing')
              s=s.replace(import_line,new_import,1)
          media_anchor="    const firstMediaUrl = String(formData.get('MediaUrl0') || '')\n    const firstMediaType = String(formData.get('MediaContentType0') || '')\n"
          media_block=media_anchor+"    const isKnownSocialPreview = isInstagramReelPreview(bodyText) || detectInstagramPreviewCard(bodyText) || detectLinkedInPreviewCard(bodyText) || detectReelUrl(bodyText) !== null\n    const previewThumbnailOnly = shouldTreatMediaAsLinkPreview({ bodyText, mediaType: firstMediaType, numMedia, mediaUrl: firstMediaUrl }) && !isKnownSocialPreview\n    if (previewThumbnailOnly) console.log('WHATSAPP_LINK_PREVIEW_MEDIA_IGNORED:', { body: bodyText.slice(0, 180), mediaType: firstMediaType })\n"
          if 'const previewThumbnailOnly =' not in s:
              if media_anchor not in s: raise SystemExit('media anchor missing')
              s=s.replace(media_anchor,media_block,1)
          old="    if (numMedia > 0 && firstMediaUrl && isImageContentType(firstMediaType)) {"
          new="    if (numMedia > 0 && firstMediaUrl && isImageContentType(firstMediaType) && !previewThumbnailOnly) {"
          if new not in s:
              if old not in s: raise SystemExit('image branch anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-booking-preview-hotfix.yml
          git config user.name "askgogo84"
          git config user.email "goverdhan.md@gmail.com"
          git add app/api/webhooks/whatsapp/route.ts .github/workflows/apply-booking-preview-hotfix.yml
          git commit -m "fix(whatsapp): ignore booking link preview thumbnails"
          git push origin HEAD:fix/whatsapp-booking-preview-routing-20260912
