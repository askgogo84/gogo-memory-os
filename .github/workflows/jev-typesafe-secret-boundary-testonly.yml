# TEST ONLY / EXPECTED RED until TypeSafe credential boundary is repaired.
# DO NOT MERGE OR DEPLOY. No real providers, secrets, or production actions.
name: "Jev TypeSafe punctuation credential boundary (expected RED)"
on:
  pull_request:
    paths:
      - "scripts/verify-jev-typesafe-secret-boundary-testonly.mts"
      - ".github/workflows/jev-typesafe-secret-boundary-testonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-typesafe-secret-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout literal pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual pure Jev request builder with synthetic-only credentials
        run: npx --no-install tsx scripts/verify-jev-typesafe-secret-boundary-testonly.mts
